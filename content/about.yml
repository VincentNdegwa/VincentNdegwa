title: About Me
description: Senior software engineer with 6+ years of experience building scalable web and AI-powered systems across ERP, FinTech, and SaaS.
content: |
  Hey, I'm **Vincent Ndegwa**, a Senior Software Engineer focused on Full-Stack and AI systems. I have 6+ years of experience building production software used by teams in retail, finance, and creator-economy platforms.

  My core backend stack includes **PHP (Laravel)**, **Node.js (NestJS/Express)**, and **Python (FastAPI/Django)**. On the frontend, I build with **React (Next.js)** and **Vue (Nuxt)**. I specialize in modernizing legacy platforms into high-performance microservices, optimizing database performance, and shipping reliable APIs at scale.

  At Paysoko Systems, I have led architecture for a multi-tenant ERP and POS platform, optimized high-volume MySQL reporting pipelines, and delivered payment workflows with **Stripe** and **Stripe Connect** for split payments and subscriptions.

  ### The AI Thread

  I hold an **MSc in Artificial Intelligence (2023-2025)** from the Open University of Kenya. My AI work includes NLP pipelines, LLM orchestration, RAG-enabled systems, and predictive analytics applied to production business workflows.

  This is practical engineering, not experimentation for its own sake: I have built sentiment analysis engines, recommendation systems, and AI-driven process automation that reduce manual effort and improve operational speed.

  ### Engineering Philosophy

  I believe in **clean architecture first**: explicit service boundaries, testable modules, and observability from day one. A system that performs well but cannot evolve safely is a long-term risk.

  I take DevOps seriously too. The systems I ship include **Dockerized environments**, **CI/CD pipelines**, and robust release practices designed for distributed teams and high-availability requirements.

  ### Education

  - **MSc Artificial Intelligence** — Open University of Kenya *(2023-2025)*
  - **BSc Software Engineering** — Kirinyaga University

  ### Beyond the Terminal

  When I'm not in a codebase, I'm experimenting with local LLMs via Ollama, following football, or writing technical articles to crystallise what I've learned.

  Browse my [projects](/projects) or [get in touch](mailto:vincentndegwa.dev@gmail.com) — I'm always open to interesting problems.
