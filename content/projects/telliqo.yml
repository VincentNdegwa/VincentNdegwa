title: Telliqo
summary: AI reputation management that reads customer feedback, routes complaints to the team and sends praise to public review channels.
description: An NLP-driven sentiment engine built with Laravel and OpenAI that classifies customer feedback automatically. Negative feedback goes to internal dashboards and positive feedback to public review channels, cutting manual processing by 40 minutes per batch.
