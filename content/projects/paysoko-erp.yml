title: Paysoko ERP & POS Platform (NDA)
description: Led development of a multi-tenant ERP and POS platform handling high-concurrency writes from 100+ retail terminals. Optimized MySQL reporting pipelines from minutes to seconds, implemented Stripe and Stripe Connect payment workflows for split payments and subscriptions, and streamlined releases through Docker and GitHub Actions CI/CD.
