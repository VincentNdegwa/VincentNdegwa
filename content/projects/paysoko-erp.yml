title: Multi-tenant ERP and POS platform
summary: Many businesses run sales, payments and reporting side by side. I rebuilt the reporting path with tuned queries, caching and queues so it stays fast under heavy load.
description: Led development of a multi-tenant ERP and POS platform for Paysoko Systems, handling high-concurrency writes from 100+ retail terminals. Optimised MySQL reporting pipelines from minutes to seconds, built Stripe and Stripe Connect flows for split payments and subscriptions, and streamlined releases with Docker and GitHub Actions.
